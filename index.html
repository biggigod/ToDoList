<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weekly Follow-up</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A2730">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F3EEDF;
    --paper-dim: #EAE3CD;
    --ink: #2A2730;
    --ink-soft: #6B6577;
    --rule: #C9BFA0;
    --fu1: #B8862B;
    --fu2: #B54B24;
    --fu3: #8E2A2A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:#DCD3B8;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding: max(22px, env(safe-area-inset-top)) 0 60px;
  }
  .app{ max-width:900px; margin:0 auto; padding:0 14px; }
  header{ text-align:center; margin-bottom:14px; }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  header p{ font-size:12px; color:var(--ink-soft); margin:0; }
  .donut-wrap{
    display:flex;
    justify-content:center;
    margin-top:12px;
  }
  .donut{
    width:84px; height:84px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .donut::before{
    content:"";
    position:absolute;
    inset:10px;
    background:#DCD3B8;
    border-radius:50%;
  }
  .donut-label{
    position:relative;
    z-index:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    font-weight:500;
  }
  .donut-caption{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:4px;
    font-family:'IBM Plex Mono', monospace;
  }

  .streaks-wrap{ margin: 14px 0 4px; }
  .streaks-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .streaks-head h3{ font-family:'Fraunces', serif; font-weight:600; font-size:14px; margin:0; }
  .streaks-row{ display:flex; gap:9px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .streak-card{
    flex-shrink:0; display:flex; align-items:center; gap:8px;
    background:var(--paper); border-radius:999px; padding:8px 10px 8px 8px;
    box-shadow:0 4px 10px rgba(0,0,0,.08); cursor:pointer; border:2px solid transparent;
    position:relative;
  }
  .streak-remove{
    background:none; border:none; color:var(--ink-soft); font-size:13px;
    cursor:pointer; padding:0 2px; flex-shrink:0; line-height:1;
  }
  .streak-remove:hover{ color:var(--fu3); }
  .streak-card.done-today{ border-color: var(--ink); }
  .streak-dot{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
  }
  .streak-card.done-today .streak-dot{ background:var(--ink); color:var(--paper); }
  .streak-info{ display:flex; flex-direction:column; line-height:1.2; }
  .streak-name{ font-size:12.5px; }
  .streak-count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }
  .streak-count.active{ color: var(--fu2); font-weight:500; }
  .streak-add{ display:flex; gap:6px; margin-top:8px; }
  .streak-add input{
    flex:1; font-size:13px; padding:8px 10px; border:1px solid var(--rule);
    border-radius:8px; background:#fff; font-family:'IBM Plex Sans', sans-serif;
  }
  .streak-add button{
    font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase;
    background:var(--ink); color:var(--paper); border:none; border-radius:8px; padding:0 12px; cursor:pointer;
  }

  .composer{ display:flex; gap:8px; margin: 18px 0 4px; flex-wrap:wrap; }
  .composer input[type=text]{
    flex:1 1 160px; min-width:0; font-family:'IBM Plex Sans', sans-serif; font-size:14px;
    padding:11px 13px; border:1px solid var(--rule); border-radius:8px; background:#fff;
  }
  .composer select, .composer input[type=number]{
    font-family:'IBM Plex Mono', monospace; font-size:11px; border:1px solid var(--rule);
    border-radius:8px; background:#fff; padding:0 8px;
  }
  .composer input[type=number]{ width:52px; text-align:center; }
  .composer input[type=date]{
    font-family:'IBM Plex Mono', monospace; font-size:11px; border:1px solid var(--rule);
    border-radius:8px; background:#fff; padding:0 6px;
  }
  .composer button{
    font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
    background:var(--ink); color:var(--paper); border:none; border-radius:8px; padding:0 16px; cursor:pointer;
  }
  .composer-hint{ font-size:11px; color:var(--ink-soft); margin: 2px 0 18px; }

  .lanes-wrap{ overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch; }
  .lanes{ display:flex; gap:12px; min-width:max-content; padding-bottom:2px; }

  .lane{
    width:222px; background:var(--paper); border-radius:8px;
    box-shadow:0 8px 20px rgba(0,0,0,.10); padding:14px 14px 16px; flex-shrink:0;
  }
  .lane.zoom{ width:150px; background:var(--paper-dim); box-shadow:0 4px 12px rgba(0,0,0,.06); }
  .lane-head{ margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid var(--ink); }
  .lane.zoom .lane-head{ border-bottom:1px dashed var(--rule); }
  .lane-head h2{ font-family:'Fraunces', serif; font-weight:600; font-size:14.5px; margin:0 0 2px; }
  .lane.zoom .lane-head h2{ font-size:12.5px; color:var(--ink-soft); font-weight:500; }
  .lane-head span{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); }

  .task-row{ padding:8px 0; border-bottom:1px dashed var(--rule); }
  .task-row:last-child{ border-bottom:none; }
  .row-top{ display:flex; align-items:flex-start; gap:8px; }
  .check{
    width:15px;height:15px; border:1.5px solid var(--ink); border-radius:50%;
    margin-top:2px; flex-shrink:0; cursor:pointer; background:none; padding:0;
  }
  .check.done{ background:var(--ink); }
  .task-main{ flex:1; min-width:0; }
  .task-text{ font-size:13.5px; line-height:1.35; }
  .task-text.done{ text-decoration:line-through; color:var(--ink-soft); }
  .task-meta{ display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap; }
  .fixed-tag{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-soft); }
  .fu-label{
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:500;
    padding:1px 6px; border-radius:999px; border:1px solid currentColor;
  }
  .fu1-c{ color:var(--fu1); } .fu2-c{ color:var(--fu2); } .fu3-c{ color:var(--fu3); }

  .pips{ display:flex; gap:4px; margin-top:5px; margin-left:23px; }
  .pip{ width:15px; height:15px; border:1.5px solid var(--ink); border-radius:50%; cursor:pointer; background:none; padding:0; }
  .pip.filled{ background:var(--ink); }

  .expand-toggle{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:10px; padding:2px 4px 2px 0; flex-shrink:0; margin-top:1px; }
  .expand-toggle svg{ transition: transform .15s ease; }
  .expand-toggle.open svg{ transform: rotate(90deg); }

  .checklist{ margin: 6px 0 2px 23px; padding: 8px 10px; background: rgba(0,0,0,.03); border-radius: 6px; }
  .checklist-item{ display:flex; align-items:center; gap:7px; padding:3px 0; }
  .checklist-item .check{ width:13px; height:13px; }
  .checklist-item span{ font-size:12.5px; flex:1; }
  .checklist-item span.done{ text-decoration:line-through; color:var(--ink-soft); }
  .checklist-item button{ background:none; border:none; color:var(--ink-soft); font-size:11px; cursor:pointer; padding:0 2px; }
  .checklist-add{ display:flex; gap:5px; margin-top:5px; }
  .checklist-add input{
    flex:1; font-size:12px; padding:5px 7px; border:1px solid var(--rule); border-radius:5px;
    background:#fff; font-family:'IBM Plex Sans', sans-serif;
  }
  .checklist-add button{
    font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
    background:var(--ink); color:var(--paper); border:none; border-radius:5px; padding:0 9px; cursor:pointer;
  }
  .checklist-empty{ font-size:11.5px; color:var(--ink-soft); font-style:italic; padding:2px 0; }

  .row-actions{ display:flex; gap:5px; margin-top:6px; margin-left:23px; }
  .row-actions button{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase;
    background:none; border:1px solid var(--rule); border-radius:6px; padding:3px 6px; cursor:pointer; color:var(--ink-soft);
  }
  .row-actions button:hover{ border-color:var(--ink); color:var(--ink); }

  .empty{ font-size:12px; color:var(--ink-soft); font-style:italic; padding:4px 0; }
  .zoom-empty{ font-size:11px; color:var(--ink-soft); font-style:italic; }

  .coming-up{ margin-top:26px; background:var(--paper); border-radius:8px; padding:14px 16px 16px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .coming-up h3{ font-family:'Fraunces', serif; font-weight:600; font-size:14px; margin:0 0 3px; }
  .coming-up-sub{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .cu-row{ display:flex; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px dashed var(--rule); font-size:13px; }
  .cu-row:last-child{ border-bottom:none; }
  .cu-date{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); flex-shrink:0; width:64px; }
  .cu-text{ flex:1; }
  .cu-row button{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; background:none; border:1px solid var(--rule);
    border-radius:6px; padding:2px 6px; cursor:pointer; color:var(--ink-soft);
  }

  footer{ text-align:center; margin-top:22px; font-size:11px; color:var(--ink-soft); max-width:560px; margin-left:auto; margin-right:auto; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Weekly Follow-up</h1>
    <p id="today-label"></p>
    <div class="donut-wrap"><div class="donut" id="week-donut"><span class="donut-label" id="week-donut-label"></span></div></div>
    <div class="donut-caption">This Week</div>
  </header>

  <div class="streaks-wrap">
    <div class="streaks-head"><h3>Daily streaks</h3></div>
    <div class="streaks-row" id="streaks-row"></div>
    <div class="streak-add">
      <input type="text" id="new-habit" placeholder="Add a daily habit… e.g. Meditate" maxlength="40">
      <button id="add-habit-btn">Add</button>
    </div>
  </div>

  <div class="composer">
    <input type="text" id="new-task" placeholder="Add a task…" maxlength="50">
    <select id="new-type">
      <option value="floating">Floating</option>
      <option value="session">Repeats (x N)</option>
      <option value="fixed">Fixed date</option>
    </select>
    <input type="number" id="new-count" min="2" max="7" value="3" style="display:none;">
    <input type="date" id="new-date">
    <button id="add-btn">Add</button>
  </div>
  <div class="composer-hint" id="composer-hint"></div>

  <div class="lanes-wrap"><div class="lanes" id="lanes"></div></div>

  <div id="coming-up-wrap"></div>

  <footer>
    Everything here lives only in this browser's local storage on this device — nothing is sent anywhere. Weeks and daily streaks roll over automatically based on your phone's real clock, even if you don't open the app every day.
  </footer>
</div>

<script>
/* ---------- persistence ---------- */
const STORE_KEY = 'wf_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      tasks, habits, subIdCounter, idCounter, habitIdCounter, lastChecked: todayISO()
    }));
  }catch(e){ console.error('save failed', e); }
}

/* ---------- date helpers (all real, based on device clock) ---------- */
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseISO(s){ return new Date(s + 'T00:00:00'); }
function isoOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDaysISO(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function mondayOf(iso){
  const d = parseISO(iso);
  const day = d.getDay(); // 0 Sun .. 6 Sat
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return isoOf(d);
}
function weeksBetween(mondayA, mondayB){
  return Math.round((parseISO(mondayB) - parseISO(mondayA)) / (7*86400000));
}
function daysBetween(a, b){
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function dayNameFor(iso){ return parseISO(iso).toLocaleDateString('en-GB', {weekday:'short'}); }

const CURRENT_MONDAY = mondayOf(todayISO());
const DETAIL_WEEKS = 4;
const ZOOM_WEEKS = 8;

/* ---------- state ---------- */
const saved = loadState();
let idCounter = saved ? saved.idCounter : 1;
let subIdCounter = saved ? saved.subIdCounter : 1;
let habitIdCounter = saved ? saved.habitIdCounter : 1;

let tasks = saved ? saved.tasks : [
  { id: idCounter++, text: "Welcome — add your first task", type: "floating", weekMonday: CURRENT_MONDAY, followUps: 0, done: false, day: null, date: null, subitems: [], expanded: false },
];
let habits = saved ? saved.habits : [];

/* ---------- catch-up: runs once on load, handles any elapsed real time ---------- */
function catchUp(){
  const lastChecked = saved && saved.lastChecked ? saved.lastChecked : todayISO();

  // Tasks: any floating/session task still sitting in a past week gets carried
  // forward to the current week, with follow-ups incremented for each week it aged.
  tasks.forEach(t => {
    if((t.type === 'floating' || t.type === 'session') && !t.done && t.weekMonday){
      const weeksLate = weeksBetween(t.weekMonday, CURRENT_MONDAY);
      if(weeksLate > 0){
        if(t.type === 'session'){
          const remaining = Math.max(0, t.target - t.sessionsDone);
          if(remaining > 0){
            t.target = remaining;
            t.sessionsDone = 0;
            t.followUps += weeksLate;
          }
        } else {
          t.followUps += weeksLate;
        }
        t.weekMonday = CURRENT_MONDAY;
      }
    }
  });

  // Habits: if a habit wasn't completed yesterday (relative to today), its streak breaks.
  const yesterday = addDaysISO(todayISO(), -1);
  habits.forEach(h => {
    if(h.lastDoneDate !== todayISO() && h.lastDoneDate !== yesterday){
      h.streak = 0;
    }
  });

  saveState();
}
if(saved) catchUp();
else saveState();

/* ---------- rendering ---------- */
const lanesEl = document.getElementById('lanes');
const comingUpEl = document.getElementById('coming-up-wrap');
const streaksRow = document.getElementById('streaks-row');

document.getElementById('today-label').textContent = parseISO(todayISO()).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});

function renderWeekDonut(){
  const thisWeekTasks = tasks.filter(t => t.weekMonday === CURRENT_MONDAY);
  let totalUnits = 0, doneUnits = 0;
  thisWeekTasks.forEach(t => {
    if(t.type === 'session'){
      totalUnits += t.target;
      doneUnits += Math.min(t.sessionsDone, t.target);
    } else {
      totalUnits += 1;
      if(t.done) doneUnits += 1;
    }
  });
  const pct = totalUnits === 0 ? 0 : Math.round((doneUnits / totalUnits) * 100);
  const donut = document.getElementById('week-donut');
  const label = document.getElementById('week-donut-label');
  donut.style.background = `conic-gradient(var(--ink) ${pct}%, #EFE8D4 ${pct}% 100%)`;
  label.textContent = totalUnits === 0 ? '—' : pct + '%';
}

function fuLabel(n, unit){
  if(n <= 0) return null;
  const ord = n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : n + "th";
  return unit ? `${unit} — ${ord} follow-up` : `${ord} follow-up`;
}
function fuClass(n){
  if(n <= 0) return "";
  if(n === 1) return "fu1-c";
  if(n === 2) return "fu2-c";
  return "fu3-c";
}
function checklistToggle(t){
  const count = t.subitems.length;
  const doneCount = t.subitems.filter(s => s.done).length;
  const badge = count ? `${doneCount}/${count}` : '';
  return `<button class="expand-toggle ${t.expanded ? 'open':''}" onclick="toggleExpand(${t.id})">
    <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 0 L7 4 L1 8 Z" fill="currentColor"/></svg>
    ${badge}
  </button>`;
}
function checklistPanel(t){
  if(!t.expanded) return '';
  const items = t.subitems.map(s => `
    <div class="checklist-item">
      <button class="check ${s.done ? 'done':''}" onclick="toggleSubitem(${t.id}, ${s.id})"></button>
      <span class="${s.done ? 'done':''}">${s.text}</span>
      <button onclick="removeSubitem(${t.id}, ${s.id})">×</button>
    </div>
  `).join('');
  return `
    <div class="checklist">
      ${items || '<div class="checklist-empty">No items yet.</div>'}
      <div class="checklist-add">
        <input type="text" placeholder="Add item…" id="sub-input-${t.id}" onkeydown="if(event.key==='Enter') addSubitem(${t.id})">
        <button onclick="addSubitem(${t.id})">Add</button>
      </div>
    </div>
  `;
}

function taskRow(t){
  if(t.type === 'session'){
    const remaining = t.target - t.sessionsDone;
    const complete = remaining <= 0;
    const label = fuLabel(t.followUps, t.followUps > 0 ? `${t.target} session${t.target>1?'s':''} left over` : null);
    const cls = fuClass(t.followUps);
    let pips = '';
    for(let i=0;i<t.target;i++){
      pips += `<button class="pip ${i < t.sessionsDone ? 'filled':''}" onclick="togglePip(${t.id}, ${i})"></button>`;
    }
    return `
      <div class="task-row">
        <div class="row-top">
          <div style="width:15px;flex-shrink:0;"></div>
          <div class="task-main">
            <div class="task-text ${complete ? 'done':''}">${t.text} <span style="color:var(--ink-soft);font-size:11.5px;">×${t.target}</span> ${checklistToggle(t)}</div>
            ${label ? `<div class="task-meta"><span class="fu-label ${cls}">${label}</span></div>` : ''}
          </div>
        </div>
        <div class="pips">${pips}</div>
        ${checklistPanel(t)}
        ${!complete ? `<div class="row-actions"><button onclick="carryOver(${t.id})">carry remaining →</button><button onclick="removeTask(${t.id})">×</button></div>` : `<div class="row-actions"><button onclick="removeTask(${t.id})">×</button></div>`}
      </div>
    `;
  }

  const cls = fuClass(t.followUps);
  const label = fuLabel(t.followUps);
  return `
    <div class="task-row">
      <div class="row-top">
        <button class="check ${t.done ? 'done':''}" onclick="toggleDone(${t.id})"></button>
        <div class="task-main">
          <div class="task-text ${t.done ? 'done':''}">${t.text} ${checklistToggle(t)}</div>
          <div class="task-meta">
            ${t.type === 'fixed' ? `<span class="fixed-tag">${t.day}</span>` : ''}
            ${label ? `<span class="fu-label ${cls}">${label}</span>` : ''}
          </div>
        </div>
      </div>
      ${checklistPanel(t)}
      <div class="row-actions">
        ${t.type === 'floating' && !t.done ? `<button onclick="carryOver(${t.id})">carry over →</button>` : ''}
        <button onclick="removeTask(${t.id})">×</button>
      </div>
    </div>
  `;
}

function weekLabel(idx){
  if(idx === 0) return "This Week";
  if(idx === 1) return "Next Week";
  return `+${idx} weeks`;
}

function render(){
  const fmt = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  let html = '';
  for(let w=0; w<ZOOM_WEEKS; w++){
    const laneMonday = addDaysISO(CURRENT_MONDAY, w*7);
    const start = parseISO(laneMonday);
    const end = new Date(start); end.setDate(end.getDate()+6);
    const isZoom = w >= DETAIL_WEEKS;
    const laneTasks = tasks.filter(t => t.weekMonday === laneMonday && (!isZoom || t.type === 'fixed'));
    html += `
      <div class="lane ${isZoom ? 'zoom':''}">
        <div class="lane-head">
          <h2>${weekLabel(w)}</h2>
          <span>${fmt(start)} – ${fmt(end)}</span>
        </div>
        ${laneTasks.length ? laneTasks.map(taskRow).join('') : `<div class="${isZoom ? 'zoom-empty':'empty'}">${isZoom ? 'Nothing fixed yet.' : 'Empty.'}</div>`}
      </div>
    `;
  }
  lanesEl.innerHTML = html;

  const zoomEdge = addDaysISO(CURRENT_MONDAY, ZOOM_WEEKS*7);
  const farOut = tasks
    .filter(t => t.type === 'fixed' && t.date && t.weekMonday >= zoomEdge)
    .sort((a,b) => a.date.localeCompare(b.date));
  comingUpEl.innerHTML = farOut.length ? `
    <div class="coming-up">
      <h3>Coming up</h3>
      <div class="coming-up-sub">Fixed dates beyond the next ${ZOOM_WEEKS} weeks — no lane, no aging, just a placeholder until it's close enough to arrive on the board.</div>
      ${farOut.map(t => `
        <div class="cu-row">
          <span class="cu-date">${parseISO(t.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>
          <span class="cu-text">${t.text}</span>
          <button onclick="removeTask(${t.id})">×</button>
        </div>
      `).join('')}
    </div>
  ` : '';

  renderHabits();
  renderWeekDonut();
  saveState();
}

function renderHabits(){
  const today = todayISO();
  streaksRow.innerHTML = habits.map(h => `
    <div class="streak-card ${h.lastDoneDate === today ? 'done-today':''}">
      <div onclick="toggleHabit(${h.id})" style="display:flex;align-items:center;gap:8px;flex:1;">
        <div class="streak-dot">${h.lastDoneDate === today ? '✓' : ''}</div>
        <div class="streak-info">
          <span class="streak-name">${h.text}</span>
          <span class="streak-count ${h.streak > 0 ? 'active':''}">${h.streak} day${h.streak === 1 ? '' : 's'}</span>
        </div>
      </div>
      <button class="streak-remove" onclick="event.stopPropagation(); removeHabit(${h.id})">×</button>
    </div>
  `).join('') + (habits.length === 0 ? '<span class="empty">No habits yet — add one below.</span>' : '');
}
function removeHabit(id){
  habits = habits.filter(h => h.id !== id);
  render();
}

/* ---------- task interactions ---------- */
function toggleExpand(id){ const t = tasks.find(t=>t.id===id); t.expanded = !t.expanded; render(); }
function addSubitem(id){
  const t = tasks.find(t=>t.id===id);
  const input = document.getElementById(`sub-input-${id}`);
  const text = input.value.trim();
  if(!text) return;
  t.subitems.push({ id: subIdCounter++, text, done:false });
  render();
  const again = document.getElementById(`sub-input-${id}`);
  if(again) again.focus();
}
function toggleSubitem(id, subId){ const t=tasks.find(t=>t.id===id); const s=t.subitems.find(s=>s.id===subId); s.done=!s.done; render(); }
function removeSubitem(id, subId){ const t=tasks.find(t=>t.id===id); t.subitems=t.subitems.filter(s=>s.id!==subId); render(); }
function toggleDone(id){ const t=tasks.find(t=>t.id===id); t.done=!t.done; render(); }
function togglePip(id, index){
  const t = tasks.find(t=>t.id===id);
  t.sessionsDone = (index < t.sessionsDone) ? index : index+1;
  render();
}
function removeTask(id){ tasks = tasks.filter(t=>t.id!==id); render(); }
function carryOver(id){
  const t = tasks.find(t=>t.id===id);
  if(t.type === 'session'){
    const remaining = t.target - t.sessionsDone;
    t.target = remaining; t.sessionsDone = 0;
  }
  t.weekMonday = addDaysISO(t.weekMonday, 7);
  t.followUps += 1;
  render();
}

/* ---------- habit interactions ---------- */
function toggleHabit(id){
  const h = habits.find(h=>h.id===id);
  const today = todayISO();
  const yesterday = addDaysISO(today, -1);
  if(h.lastDoneDate === today){
    // undo today's tick
    h.lastDoneDate = null;
    h.streak = Math.max(0, h.streak - 1);
  } else {
    h.streak = (h.lastDoneDate === yesterday) ? h.streak + 1 : 1;
    h.lastDoneDate = today;
  }
  render();
}
document.getElementById('add-habit-btn').onclick = () => {
  const input = document.getElementById('new-habit');
  const text = input.value.trim();
  if(!text) return;
  habits.push({ id: habitIdCounter++, text, streak:0, lastDoneDate:null });
  input.value = '';
  render();
};
document.getElementById('new-habit').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('add-habit-btn').click(); });

/* ---------- composer ---------- */
const typeSel = document.getElementById('new-type');
const countInput = document.getElementById('new-count');
const dateInput = document.getElementById('new-date');
const hintEl = document.getElementById('composer-hint');
const hints = {
  floating: 'Starts This Week by default — pick a date to schedule it into a future week instead.',
  session: '"Repeats" adds a task with tickable sessions — e.g. Gym × 3. Pick a date to start it in a future week.',
  fixed: 'Pick any date — up to a year out. It won\'t age; it just waits for its week.'
};
function refreshHint(){
  hintEl.textContent = hints[typeSel.value];
  if(typeSel.value === 'fixed' && !dateInput.value) dateInput.value = todayISO();
  else if(typeSel.value !== 'fixed') dateInput.value = '';
}
typeSel.addEventListener('change', () => {
  countInput.style.display = typeSel.value === 'session' ? 'inline-block' : 'none';
  refreshHint();
});
refreshHint();

document.getElementById('add-btn').onclick = () => {
  const input = document.getElementById('new-task');
  const text = input.value.trim();
  if(!text) return;
  const type = typeSel.value;
  const task = {
    id: idCounter++, text, type,
    weekMonday: CURRENT_MONDAY, followUps: 0, done: false,
    day: null, date: null, subitems: [], expanded: false,
  };
  if(type === 'session'){ task.target = parseInt(countInput.value,10) || 3; task.sessionsDone = 0; }
  if(type === 'fixed'){
    const chosen = dateInput.value || todayISO();
    task.date = chosen;
    task.weekMonday = mondayOf(chosen);
    task.day = dayNameFor(chosen);
  }
  if((type === 'floating' || type === 'session') && dateInput.value){
    task.weekMonday = mondayOf(dateInput.value);
  }
  tasks.push(task);
  input.value = '';
  dateInput.value = typeSel.value === 'fixed' ? todayISO() : '';
  render();
};
document.getElementById('new-task').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('add-btn').click(); });

render();
</script>
</body>
</html>
